<h1>Cellmori 电池管家</h1><p>原生菜单栏电源管理工具。查看电量与电池健康，设置充电上限，管理充放电流程。</p>
<ul><li>应用安装到“应用程序”文件夹。</li><li>可选安装电源管理后台，服务名为 <b>io.cellmori.helper</b>。</li><li>更新保留现有策略，新安装默认由系统管理。</li><li>支持选择关闭面板后是否保留程序坞图标。</li></ul>
<p>适用于 Apple Silicon MacBook，macOS 15.x 或 26.x。已有 MacBook Pro（M4）/ macOS 26 用户报告全部功能验证通过；其他机型和固件仍需核对。</p></html>
