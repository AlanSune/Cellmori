<h1>接下来</h1><p>安装器在验证后台成功后会自动打开 <b>Cellmori</b>。如未自动打开，请从“应用程序”启动。</p><p>如果选择了后台组件，进入“后台服务”页，确认名称为 <b>io.cellmori.helper</b>，状态为“已安装 · 运行正常”。</p>
<p>若只安装了应用，可稍后在同一页面安装后台。更新会保留原策略，不会自动开启新的限充或放电流程。</p><p>macOS 26 用户可先查看“兼容性”页并导出报告。实验性适配器模式仅在满足条件且手动确认后启用。</p><p>“偏好设置”可设置关闭面板后的程序坞行为。卸载后台请使用应用内“卸载”功能，以便先恢复供电策略。</p></html>
